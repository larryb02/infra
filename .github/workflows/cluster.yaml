name: Manage k3s cluster

on:
  push:
    branches:
      - development
      - main
    paths:
      - "terraform/aws/cluster/**"
  workflow_dispatch:

env:
  AWS_REGION: us-west-1
  CLUSTER_DIR: terraform/aws/cluster
  S3_BUCKET: lkb-main-s3-bucket

jobs:
  # plan:
  #   if: github.ref == 'refs/heads/development'
  #   runs-on: ubuntu-latest
  #   permissions:
  #     id-token: write
  #     contents: read
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: aws-actions/configure-aws-credentials@v6
  #       with:
  #         role-to-assume: ${{ secrets.AWS_GITHUB_RUNNER_ROLE }}
  #         aws-region: ${{ env.AWS_REGION }}
  #     - uses: hashicorp/setup-terraform@v3
  #     - run: echo "${{ secrets.CLUSTER_PUBLIC_KEY }}" > /tmp/cluster.pub
  #     - run: |
  #         terraform -chdir=$CLUSTER_DIR init
  #         terraform -chdir=$CLUSTER_DIR validate
  #         terraform -chdir=$CLUSTER_DIR plan -var="public_key_path=/tmp/cluster.pub"

  apply:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_RUNNER_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
      - run: |
          terraform -chdir=$CLUSTER_DIR init
          terraform -chdir=$CLUSTER_DIR validate
          terraform -chdir=$CLUSTER_DIR apply -auto-approve -var="agent_count=0" -var="server_instance_type=t2.medium"

  bootstrap_cluster:
    runs-on: ubuntu-latest
    needs: [apply]
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_RUNNER_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Install Ansible and SSM plugin
        run: |
          sudo apt install -y python3-pip
          pip3 install ansible boto3 botocore
          ansible-galaxy collection install amazon.aws community.aws:==9.3.0
          curl -fsSL "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb" -o "session-manager-plugin.deb"
          sudo dpkg -i session-manager-plugin.deb
      - name: Bootstrap k3s cluster
        run: |
          ansible-playbook -vvv \
            -i ansible/bootstrap_cluster/inventory/aws_ec2.yml \
            ansible/bootstrap_cluster/site.yml
      - name: Upload kubeconfig to S3
        run: aws s3 cp /tmp/k3s.yaml s3://$S3_BUCKET/kubeconfig/k3s.yaml
