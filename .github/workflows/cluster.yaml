name: Deploy k8s Cluster

on:
  push:
    branches:
      - main
      - development
    paths:
      - "projects/cluster/terraform/**"
  workflow_dispatch:
    inputs:
      env:
        description: Target environment
        required: true
        type: choice
        options: [prod, dev]
        default: prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    env:
      ENV: ${{ inputs.env || (github.ref == 'refs/heads/main' && 'prod' || 'dev') }}
      TF_DIR: projects/cluster/terraform

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: true

      - name: Check version is new
        run: |
          VERSION=$(cat projects/cluster/VERSION.txt | tr -d '[:space:]')
          TAG="cluster/${{ env.ENV }}/v${VERSION}"
          if git tag --list "$TAG" | grep -q "$TAG"; then
            echo "Tag $TAG already exists. Bump VERSION.txt before deploying."
            exit 1
          fi
          echo "Deploying version $VERSION (tag: $TAG)"
          echo "CLUSTER_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_RUNNER_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{secrets.AWS_BUCKET}}" \
            -backend-config="key=cluster/${{ env.ENV }}/terraform.tfstate" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -backend-config="encrypt=true"

      - name: Terraform plan
        working-directory: ${{ env.TF_DIR }}
        run: terraform plan -var-file="envs/${{ env.ENV }}.tfvars"

      - name: Terraform apply
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -auto-approve -var-file="envs/${{ env.ENV }}.tfvars"

      - name: Tag release
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ github.token }}
          custom_tag: cluster/${{ env.ENV }}/v${{ env.CLUSTER_VERSION }}
          tag_prefix: ""
