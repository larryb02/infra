name: Manage k3s cluster

on:
  push:
    branches:
      - main
    paths:
      - "projects/cluster/**"
  workflow_dispatch:
    inputs:
      env:
        description: Target environment
        required: true
        type: choice
        options: [prod, dev]
        default: prod

jobs:
  apply:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/_tf-apply.yaml
    with:
      project: cluster
      env: ${{ inputs.env || 'prod' }}
      tf_dir: projects/cluster/terraform
    secrets:
      aws_role: ${{ secrets.AWS_GITHUB_RUNNER_ROLE }}

  bootstrap:
    needs: apply
    uses: ./.github/workflows/_ansible-bootstrap.yaml
    with:
      project: cluster
      playbook_dir: projects/cluster/ansible
      env: ${{ inputs.env || 'prod' }}
    secrets:
      aws_role: ${{ secrets.AWS_GITHUB_RUNNER_ROLE }}

  upload-kubeconfig:
    runs-on: ubuntu-latest
    needs: bootstrap
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_RUNNER_ROLE }}
          aws-region: us-west-1
      - name: Upload kubeconfig to S3
        run: bash projects/cluster/scripts/upload-kubeconfig.sh
        env:
          S3_BUCKET: lkb-main-s3-bucket

  tag:
    needs: upload-kubeconfig
    uses: ./.github/workflows/_tag-release.yaml
    with:
      project: cluster
      env: ${{ inputs.env || 'prod' }}
      version_file: projects/cluster/VERSION.txt
