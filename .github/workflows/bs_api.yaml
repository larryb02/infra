name: Deploy bs_api

on:
  push:
    branches:
      - main
    paths:
      - "projects/bs_api/**"
  workflow_dispatch:
    inputs:
      env:
        description: Target environment
        required: true
        type: choice
        options: [prod, dev]
        default: prod

jobs:
  apply:
    uses: ./.github/workflows/_tf-apply.yaml
    with:
      project: bs_api
      env: ${{ inputs.env || 'prod' }}
      tf_dir: projects/bs_api/terraform
    secrets:
      aws_role: ${{ secrets.AWS_GITHUB_RUNNER_ROLE }}

  bootstrap:
    needs: apply
    uses: ./.github/workflows/_ansible-bootstrap.yaml
    with:
      project: bs_api
      playbook_dir: projects/bs_api/ansible
      env: ${{ inputs.env || 'prod' }}
      extra_vars: certbot_admin_email=${{ secrets.CERTBOT_EMAIL }}
    secrets:
      aws_role: ${{ secrets.AWS_GITHUB_RUNNER_ROLE }}

  tag:
    needs: bootstrap
    uses: ./.github/workflows/_tag-release.yaml
    with:
      project: bs_api
      env: ${{ inputs.env || 'prod' }}
      version_file: projects/bs_api/VERSION.txt
