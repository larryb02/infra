---
- name: Bootstrap Buildserver Instance
  hosts: buildserver
  gather_facts: true
  become: true

  vars:
    containerd_version: 2.1.0
    nerdctl_version: 2.1.2
    cni_plugins_version: 1.7.1
    containerd_package: containerd

  tasks:
    - name: Upgrade all packages
      ansible.builtin.dnf:
        name: "*"
        state: latest

    - name: Configure containerd
      ansible.builtin.include_role:
        name: ../../roles/ansible-role-containerd

    - name: Install nerdctl  
      ansible.builtin.dnf:
        name: nerdctl
        state: present

    - name: Create SSL certificate directory
      ansible.builtin.file:
        path: /etc/certs/bs
        state: directory
        mode: '0755'

    - name: Copy TLS certificate
      ansible.builtin.copy:
        content: "{{ cert_crt }}"
        dest: /etc/certs/bs/server.crt
        mode: '0644'

    - name: Copy TLS private key
      ansible.builtin.copy:
        content: "{{ cert_key }}"
        dest: /etc/certs/bs/server.key
        mode: '0600'
