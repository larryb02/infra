---
- name: Create k3s config directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: '0755'

- name: Copy k3s config
  ansible.builtin.copy:
    src: config.yaml
    dest: /etc/rancher/k3s/config.yaml
    mode: '0644'

- name: Install k3s server
  ansible.builtin.shell: curl -sfL https://get.k3s.io | sh -
  args:
    creates: /usr/local/bin/k3s

- name: Verify k3s binaries are installed
  ansible.builtin.file:
    path: "{{ item }}"
    state: file
  loop:
    - /usr/local/bin/k3s
    - /usr/local/bin/kubectl
    - /usr/local/bin/crictl
    - /usr/local/bin/ctr
    - /usr/local/bin/k3s-killall.sh
    - /usr/local/bin/k3s-uninstall.sh

- name: Verify kubeconfig exists
  ansible.builtin.file:
    path: /etc/rancher/k3s/k3s.yaml
    state: file

- name: Verify k3s service is enabled and running
  ansible.builtin.systemd:
    name: k3s
  register: k3s_service

- name: Assert k3s service is running and enabled
  ansible.builtin.assert:
    that:
      - k3s_service.status.ActiveState == "active"
      - k3s_service.status.UnitFileState == "enabled"
    fail_msg: "k3s service is not running or not enabled for restart on boot"

- name: Fetch kubeconfig
  ansible.builtin.fetch:
    src: /etc/rancher/k3s/k3s.yaml
    dest: /tmp/k3s.yaml
    flat: true
